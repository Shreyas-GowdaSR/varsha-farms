<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube banner maker</title>
<meta name="robots" content="noindex">
<!-- Open with: node server.js, then http://localhost:8080/brand/banner-maker.html . Edit the text below, reload, then right-click the image > Save image as. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@400;500&family=Tiro+Kannada&display=block">
<style>body{margin:0;background:#222} canvas{width:100%;height:auto;display:block}</style>
</head>
<body>
<canvas id="c" width="2560" height="1440"></canvas>
<script>
// YouTube channel art: 2560x1440. Everything important stays inside the centre "safe area"
// (1546x423, x 507-2053, y 508-931) that phones, laptops and TVs all show.
const W = 2560, H = 1440, SAFE = { x: 507, y: 508, w: 1546, h: 423 };
const C = { ink: '#1d1814', ivory: '#f5f0e7', gold: '#b8935a', goldLight: '#d6b57c', soft: 'rgba(245,240,231,.82)' };

function img(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }

async function draw() {
  await Promise.all([
    document.fonts.load('500 150px "Cormorant Garamond"'),
    document.fonts.load('italic 400 50px "Cormorant Garamond"'),
    document.fonts.load('500 26px Jost'),
    document.fonts.load('40px "Tiro Kannada"', 'ಶೆಡ್‌ನಲ್ಲಿ ಸಾಕಿದ ಅಮೀನಗಡ ಕುರಿಗಳು'),
  ]);
  const [photo, logo] = await Promise.all([img('../media/home/ewe-golden-field.webp'), img('../assets/img/logo-512.webp')]);
  const c = document.getElementById('c'), x = c.getContext('2d');

  // 1. Background: the sunny-field ewe, softly blurred and toned down (TV/desktop edges show it).
  const s = Math.max(W / photo.width, H / photo.height) * 1.14;
  const pw = photo.width * s, ph = photo.height * s;
  x.fillStyle = '#2a1d12'; x.fillRect(0, 0, W, H);
  x.filter = 'blur(9px) saturate(1.05)';
  x.drawImage(photo, (W - pw) / 2 + 60, (H - ph) / 2, pw, ph);
  x.filter = 'none';
  x.fillStyle = 'rgba(20,14,9,.62)'; x.fillRect(0, 0, W, H);

  // 2. Calm dark band behind the safe area so text always reads cleanly.
  x.fillStyle = 'rgba(22,16,11,.72)';
  x.fillRect(0, SAFE.y - 26, W, SAFE.h + 52);
  x.strokeStyle = C.gold; x.lineWidth = 2;
  [SAFE.y - 26, SAFE.y + SAFE.h + 26].forEach(yy => { x.beginPath(); x.moveTo(0, yy); x.lineTo(W, yy); x.stroke(); });
  x.globalAlpha = .45; x.lineWidth = 1;
  [SAFE.y - 36, SAFE.y + SAFE.h + 36].forEach(yy => { x.beginPath(); x.moveTo(0, yy); x.lineTo(W, yy); x.stroke(); });
  x.globalAlpha = 1;

  // 3. Logo (round) on the left of the safe area.
  const L = 372, lx = SAFE.x + 70, ly = SAFE.y + (SAFE.h - L) / 2;
  x.save(); x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 40; x.shadowOffsetY = 10;
  x.drawImage(logo, lx, ly, L, L); x.restore();

  // 4. Fine vertical rule.
  const rx = lx + L + 62;
  x.strokeStyle = C.gold; x.globalAlpha = .7; x.lineWidth = 1.5;
  x.beginPath(); x.moveTo(rx, SAFE.y + 40); x.lineTo(rx, SAFE.y + SAFE.h - 40); x.stroke(); x.globalAlpha = 1;

  // 5. Text block.
  const tx = rx + 62, maxW = SAFE.x + SAFE.w - 40 - tx;
  x.textBaseline = 'alphabetic';

  // eyebrow
  x.font = '500 27px Jost'; x.letterSpacing = '9px'; x.fillStyle = C.goldLight;
  x.fillText('SONTENAHALLI  ·  NEAR BENGALURU', tx, SAFE.y + 78);

  // brand name, sized to fit
  let size = 160; x.letterSpacing = '16px';
  do { x.font = `500 ${size}px "Cormorant Garamond"`; size -= 2; } while (x.measureText('VSSR FARMS').width > maxW && size > 60);
  x.fillStyle = C.ivory; x.fillText('VSSR FARMS', tx - 4, SAFE.y + 78 + size * .98);
  const nameBase = SAFE.y + 78 + size * .98;

  // tagline
  x.letterSpacing = '0px'; x.font = 'italic 400 52px "Cormorant Garamond"'; x.fillStyle = C.soft;
  x.fillText('Shed-raised Amingad sheep, cared for by hand', tx, nameBase + 74);

  // Kannada line
  x.font = '40px "Tiro Kannada"'; x.fillStyle = C.goldLight;
  x.fillText('ಶೆಡ್‌ನಲ್ಲಿ ಸಾಕಿದ ಅಮೀನಗಡ ಕುರಿಗಳು', tx, nameBase + 138);

  // contact
  x.font = '500 25px Jost'; x.letterSpacing = '7px'; x.fillStyle = C.ivory;
  const label = 'CALL / WHATSAPP   ';
  x.fillText(label, tx, nameBase + 198);
  const lw = x.measureText(label).width;
  x.fillStyle = C.goldLight; x.letterSpacing = '4px';
  x.fillText('+91 99009 48641', tx + lw, nameBase + 198);
  x.letterSpacing = '0px';

  window.bannerReady = { size, nameBase, bottom: nameBase + 198, safeBottom: SAFE.y + SAFE.h, textRight: tx + maxW };
}
window.bannerDone = draw().catch(e => { window.bannerError = String(e); });
</script>
</body>
</html>
